<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('SQL Console')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
    <h1>Ad hoc SQL console</h1>
    <p class="lead">Run a read-only <code>SELECT</code> against the CIKGU schema
        (tables: <code>app_user</code>, <code>learner</code>, <code>tutor</code>, <code>goal</code>,
        <code>module</code>, <code>module_tutor</code>, <code>enrollment</code>,
        view <code>module_progress_v</code>). Results are capped at 200 rows.</p>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="card">
        <form th:action="@{/console}" method="post">
            <label for="sql">SELECT statement</label>
            <textarea class="sql" id="sql" name="sql" th:text="${sql}" spellcheck="false"></textarea>
            <button class="btn" type="submit">Run query</button>
        </form>
    </div>

    <div class="flash err" th:if="${consoleError}" th:text="${consoleError}"></div>

    <div class="card" th:if="${result}">
        <h2 style="margin-top:0"><span th:text="${result.rowCount}">0</span> row(s)</h2>
        <div class="table-scroll">
            <table>
                <tr>
                    <th th:each="c : ${result.columns}" th:text="${c}">COL</th>
                </tr>
                <tr th:each="row : ${result.rows}">
                    <td th:each="cell : ${row}" th:text="${cell} ?: '—'">value</td>
                </tr>
            </table>
        </div>
    </div>
</main>
</body>
</html>
