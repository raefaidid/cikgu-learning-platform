<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit Goal')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
    <h1>Edit goal</h1>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="card" style="max-width:560px">
        <form th:action="@{/learner/goals/{id}/edit(id=${goal.goalId})}" method="post">
            <label for="goalTitle">Goal title</label>
            <input type="text" id="goalTitle" name="goalTitle" maxlength="200" required
                   th:value="${goal.goalTitle}">

            <label for="targetOutcome">Target outcome</label>
            <textarea id="targetOutcome" name="targetOutcome" maxlength="500" rows="2"
                      th:text="${goal.targetOutcome}"></textarea>

            <label for="targetDate">Target date</label>
            <input type="date" id="targetDate" name="targetDate" th:value="${goal.targetDate}">

            <button class="btn" type="submit">Save changes</button>
            <a class="btn ghost" th:href="@{/learner/goals}">Cancel</a>
        </form>
    </div>
</main>
</body>
</html>
