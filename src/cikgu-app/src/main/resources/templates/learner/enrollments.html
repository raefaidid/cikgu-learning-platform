<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Enrollments')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
    <h1>My enrollments</h1>
    <p class="lead">Progress and status are updated by your tutors; the database
        stamps <code>last_updated_at</code> automatically on every change.</p>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="card">
        <p class="muted" th:if="${#lists.isEmpty(enrollments)}">
            You are not enrolled in any module yet — <a th:href="@{/learner/modules}">browse modules</a>.
        </p>
        <div class="table-scroll" th:unless="${#lists.isEmpty(enrollments)}">
            <table>
                <tr>
                    <th>Module</th><th>Linked goal</th><th>Enrolled</th>
                    <th>Progress</th><th>Status</th><th>Last updated</th><th></th>
                </tr>
                <tr th:each="e : ${enrollments}">
                    <td th:text="${e.moduleTitle}">Module</td>
                    <td>
                        <span th:text="${e.goalTitle} ?: '—'">Goal</span>
                        <span class="badge behind" th:if="${e.behindSchedule}"
                              th:title="'Goal target date ' + ${e.targetDate} + ' has passed'">BEHIND</span>
                    </td>
                    <td th:text="${e.enrollDate}">2026-01-01</td>
                    <td>
                        <span class="meter"><span th:style="'width:' + ${e.progressScore} + '%'"></span></span>
                        <span class="meter-label" th:text="${#numbers.formatDecimal(e.progressScore,1,0)} + '%'">0%</span>
                    </td>
                    <td><span class="badge" th:classappend="${#strings.toLowerCase(e.status)}"
                              th:text="${e.status}">STATUS</span></td>
                    <td th:text="${e.lastUpdatedAt != null ? #temporals.format(e.lastUpdatedAt,'yyyy-MM-dd HH:mm') : '—'}">—</td>
                    <td>
                        <form class="inline" th:action="@{/learner/enrollments/{id}/drop(id=${e.moduleId})}" method="post"
                              onsubmit="return confirm('Cancel this enrollment? This removes the record entirely.');">
                            <button class="btn small danger" type="submit">Cancel</button>
                        </form>
                    </td>
                </tr>
            </table>
        </div>
    </div>
</main>
</body>
</html>
