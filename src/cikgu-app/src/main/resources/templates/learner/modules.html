<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Browse Modules')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
    <h1>Browse modules</h1>
    <p class="lead">Enroll in a module and optionally link it to one of your goals.</p>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="card">
        <form class="inline" th:action="@{/learner/modules}" method="get">
            <input type="text" name="q" placeholder="Search title…" th:value="${q}">
            <select name="difficulty">
                <option value="" th:selected="${difficulty == null or difficulty == ''}">All difficulties</option>
                <option value="BEGINNER" th:selected="${difficulty == 'BEGINNER'}">Beginner</option>
                <option value="INTERMEDIATE" th:selected="${difficulty == 'INTERMEDIATE'}">Intermediate</option>
                <option value="ADVANCED" th:selected="${difficulty == 'ADVANCED'}">Advanced</option>
            </select>
            <button class="btn small" type="submit">Filter</button>
        </form>
    </div>

    <div class="card">
        <p class="muted" th:if="${#lists.isEmpty(modules)}">No modules match your filter.</p>
        <div class="table-scroll" th:unless="${#lists.isEmpty(modules)}">
            <table>
                <tr>
                    <th>Module</th><th>Difficulty</th><th class="num">Hours</th>
                    <th>Lead tutor</th><th>Enroll</th>
                </tr>
                <tr th:each="m : ${modules}">
                    <td>
                        <strong th:text="${m.moduleTitle}">Title</strong><br>
                        <span class="muted" th:text="${m.description}">Description</span>
                    </td>
                    <td><span class="badge" th:classappend="${#strings.toLowerCase(m.difficulty ?: '')}"
                              th:text="${m.difficulty}">LEVEL</span></td>
                    <td class="num" th:text="${m.durationHours} ?: '—'">10</td>
                    <td th:text="${m.leadTutorName} ?: '—'">Tutor</td>
                    <td>
                        <form class="inline" th:action="@{/learner/enroll}" method="post">
                            <input type="hidden" name="moduleId" th:value="${m.moduleId}">
                            <select name="goalId">
                                <option value="">No linked goal</option>
                                <option th:each="g : ${myGoals}" th:value="${g.goalId}"
                                        th:text="${g.goalTitle}">Goal</option>
                            </select>
                            <button class="btn small" type="submit">Enroll</button>
                        </form>
                    </td>
                </tr>
            </table>
        </div>
    </div>
</main>
</body>
</html>
