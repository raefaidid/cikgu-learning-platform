<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('New Module')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
    <h1>Create a module</h1>
    <p class="lead">You become the module's LEAD tutor — the module row and your
        LEAD assignment are inserted in one transaction.</p>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="card" style="max-width:560px">
        <form th:action="@{/tutor/modules}" method="post">
            <label for="moduleTitle">Module title</label>
            <input type="text" id="moduleTitle" name="moduleTitle" maxlength="200" required>

            <label for="description">Description</label>
            <textarea id="description" name="description" maxlength="1000" rows="3"></textarea>

            <label for="durationHours">Duration (hours)</label>
            <input type="number" id="durationHours" name="durationHours" min="1" max="99999">

            <label for="difficulty">Difficulty</label>
            <select id="difficulty" name="difficulty">
                <option value="BEGINNER">Beginner</option>
                <option value="INTERMEDIATE">Intermediate</option>
                <option value="ADVANCED">Advanced</option>
            </select>

            <button class="btn" type="submit">Create module</button>
            <a class="btn ghost" th:href="@{/tutor/modules}">Cancel</a>
        </form>
    </div>
</main>
</body>
</html>
