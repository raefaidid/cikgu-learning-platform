<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit Module')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
    <h1>Edit module</h1>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="card" style="max-width:560px">
        <form th:action="@{/tutor/modules/{id}/edit(id=${module.moduleId})}" method="post">
            <label for="moduleTitle">Module title</label>
            <input type="text" id="moduleTitle" name="moduleTitle" maxlength="200" required
                   th:value="${module.moduleTitle}">

            <label for="description">Description</label>
            <textarea id="description" name="description" maxlength="1000" rows="3"
                      th:text="${module.description}"></textarea>

            <label for="durationHours">Duration (hours)</label>
            <input type="number" id="durationHours" name="durationHours" min="1" max="99999"
                   th:value="${module.durationHours}">

            <label for="difficulty">Difficulty</label>
            <select id="difficulty" name="difficulty">
                <option value="BEGINNER" th:selected="${module.difficulty == 'BEGINNER'}">Beginner</option>
                <option value="INTERMEDIATE" th:selected="${module.difficulty == 'INTERMEDIATE'}">Intermediate</option>
                <option value="ADVANCED" th:selected="${module.difficulty == 'ADVANCED'}">Advanced</option>
            </select>

            <button class="btn" type="submit">Save changes</button>
            <a class="btn ghost" th:href="@{/tutor/modules}">Cancel</a>
        </form>
    </div>
</main>
</body>
</html>
