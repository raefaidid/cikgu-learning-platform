<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Learner Progress')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
    <h1>Learner progress</h1>
    <p class="lead">Learners enrolled in modules you lead or co-teach. Saving a row
        fires the database trigger that stamps <code>last_updated_at</code>.</p>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="card">
        <p class="muted" th:if="${#lists.isEmpty(enrollments)}">
            No learners are enrolled in your modules yet.
        </p>
        <div class="table-scroll" th:unless="${#lists.isEmpty(enrollments)}">
            <table>
                <tr>
                    <th>Module</th><th>Learner</th><th>Goal</th>
                    <th>Last updated</th><th>Progress / status</th>
                </tr>
                <tr th:each="e : ${enrollments}">
                    <td th:text="${e.moduleTitle}">Module</td>
                    <td>
                        <span th:text="${e.learnerName}">Learner</span>
                        <span class="badge behind" th:if="${e.behindSchedule}">BEHIND</span>
                    </td>
                    <td th:text="${e.goalTitle} ?: '—'">Goal</td>
                    <td th:text="${e.lastUpdatedAt != null ? #temporals.format(e.lastUpdatedAt,'yyyy-MM-dd HH:mm') : '—'}">—</td>
                    <td>
                        <form class="inline" th:action="@{/tutor/progress}" method="post">
                            <input type="hidden" name="learnerId" th:value="${e.userId}">
                            <input type="hidden" name="moduleId" th:value="${e.moduleId}">
                            <input type="number" name="progressScore" min="0" max="100" step="0.5"
                                   style="width:5.5rem" th:value="${e.progressScore}">
                            <select name="status">
                                <option value="NOT_STARTED" th:selected="${e.status == 'NOT_STARTED'}">Not started</option>
                                <option value="IN_PROGRESS" th:selected="${e.status == 'IN_PROGRESS'}">In progress</option>
                                <option value="COMPLETED" th:selected="${e.status == 'COMPLETED'}">Completed</option>
                                <option value="DROPPED" th:selected="${e.status == 'DROPPED'}">Dropped</option>
                            </select>
                            <button class="btn small" type="submit">Save</button>
                        </form>
                    </td>
                </tr>
            </table>
        </div>
    </div>
</main>
</body>
</html>
