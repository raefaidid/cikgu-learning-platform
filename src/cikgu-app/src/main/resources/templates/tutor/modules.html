<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Modules')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
    <h1>My modules</h1>
    <p class="lead">Modules you lead or co-teach. <a class="btn small" th:href="@{/tutor/modules/new}">+ New module</a></p>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="card">
        <p class="muted" th:if="${#lists.isEmpty(modules)}">You are not assigned to any module yet.</p>
        <div class="table-scroll" th:unless="${#lists.isEmpty(modules)}">
            <table>
                <tr>
                    <th>Module</th><th>Difficulty</th><th class="num">Hours</th>
                    <th>Lead tutor</th><th></th>
                </tr>
                <tr th:each="m : ${modules}">
                    <td>
                        <strong th:text="${m.moduleTitle}">Title</strong><br>
                        <span class="muted" th:text="${m.description}">Description</span>
                    </td>
                    <td><span class="badge" th:classappend="${#strings.toLowerCase(m.difficulty ?: '')}"
                              th:text="${m.difficulty}">LEVEL</span></td>
                    <td class="num" th:text="${m.durationHours} ?: '—'">10</td>
                    <td th:text="${m.leadTutorName} ?: '—'">Tutor</td>
                    <td style="white-space:nowrap">
                        <a class="btn small ghost" th:href="@{/tutor/modules/{id}/edit(id=${m.moduleId})}">Edit</a>
                        <a class="btn small ghost" th:href="@{/tutor/modules/{id}/teachers(id=${m.moduleId})}">Co-teachers</a>
                        <form class="inline" th:action="@{/tutor/modules/{id}/delete(id=${m.moduleId})}" method="post"
                              onsubmit="return confirm('Delete this module? All enrollments and tutor assignments are removed by cascading foreign keys.');">
                            <button class="btn small danger" type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
            </table>
        </div>
    </div>
</main>
</body>
</html>
