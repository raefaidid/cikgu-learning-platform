<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body>
<div class="auth-wrap">
    <div class="brand-big">Create your Cikgu account</div>
    <p class="hint">
        One form, two account types: registration inserts the APP_USER superclass row and
        the LEARNER/TUTOR subclass row in a single database transaction.
    </p>

    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="card">
        <form th:action="@{/register}" method="post">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" name="fullName" maxlength="150" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" maxlength="150" required>

            <label for="password">Password (min 8 characters)</label>
            <input type="password" id="password" name="password" minlength="8" required>

            <label for="phone">Phone (optional)</label>
            <input type="text" id="phone" name="phone" maxlength="30">

            <label for="userType">I am a</label>
            <select id="userType" name="userType"
                    onchange="document.getElementById('learnerFields').style.display = this.value === 'LEARNER' ? '' : 'none';
                              document.getElementById('tutorFields').style.display = this.value === 'TUTOR' ? '' : 'none';">
                <option value="LEARNER">Learner</option>
                <option value="TUTOR">Tutor</option>
            </select>

            <div id="learnerFields">
                <label for="educationBackground">Education background</label>
                <textarea id="educationBackground" name="educationBackground" maxlength="500" rows="2"></textarea>

                <label for="parsedSkills">Skills (comma-separated)</label>
                <input type="text" id="parsedSkills" name="parsedSkills" maxlength="1000">
            </div>

            <div id="tutorFields" style="display:none">
                <label for="expertise">Expertise</label>
                <input type="text" id="expertise" name="expertise" maxlength="300">

                <label for="yearsExperience">Years of experience</label>
                <input type="number" id="yearsExperience" name="yearsExperience" min="0" max="99">
            </div>

            <button class="btn" type="submit">Register</button>
        </form>
    </div>

    <p class="hint">Already registered? <a th:href="@{/login}">Log in</a></p>
</div>
</body>
</html>
