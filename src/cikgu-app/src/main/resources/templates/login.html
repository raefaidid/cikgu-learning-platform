<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Log in')}"></head>
<body>
<div class="auth-wrap">
    <div class="brand-big">Cikgu</div>
    <p class="hint">Personalized Learning Platform — ICT502 Database Engineering</p>

    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="flash err" th:if="${param.error}">Invalid email or password.</div>
    <div class="flash ok" th:if="${param.logout}">You have been logged out.</div>

    <div class="card">
        <form th:action="@{/login}" method="post">
            <label for="username">Email</label>
            <input type="email" id="username" name="username" required autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button class="btn" type="submit">Log in</button>
        </form>
    </div>

    <p class="hint">
        No account yet? <a th:href="@{/register}">Register as a Learner or Tutor</a><br>
        Seeded accounts all use password <code>password123</code>
        (e.g. <code>aina.sofea@cikgu.my</code> / <code>halim.abdullah@cikgu.my</code>).
    </p>
</div>
</body>
</html>
