<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Cikgu'">Cikgu</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<nav th:fragment="nav">
    <a class="brand" th:href="@{/}">Cikgu</a>

    <th:block sec:authorize="hasRole('LEARNER')">
        <a th:href="@{/learner/dashboard}">Dashboard</a>
        <a th:href="@{/learner/goals}">My Goals</a>
        <a th:href="@{/learner/modules}">Browse Modules</a>
        <a th:href="@{/learner/enrollments}">My Enrollments</a>
    </th:block>

    <th:block sec:authorize="hasRole('TUTOR')">
        <a th:href="@{/tutor/dashboard}">Dashboard</a>
        <a th:href="@{/tutor/modules}">My Modules</a>
        <a th:href="@{/tutor/progress}">Learner Progress</a>
        <a th:href="@{/tutor/mentorship}">Mentorship</a>
    </th:block>

    <a th:href="@{/reports}">Reports</a>
    <a th:href="@{/console}">SQL Console</a>

    <span class="spacer"></span>
    <span class="who" sec:authentication="principal.fullName">User</span>
    <a th:href="@{/profile}">Profile</a>
    <form th:action="@{/logout}" method="post">
        <button type="submit">Log out</button>
    </form>
</nav>

<div th:fragment="flash">
    <div class="flash ok" th:if="${msg}" th:text="${msg}"></div>
    <div class="flash err" th:if="${err}" th:text="${err}"></div>
</div>

</body>
</html>
